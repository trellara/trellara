name: Correctness Report

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/correctness-report.yml"
      - "Makefile"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "crates/**"
      - "docs/correctness-report.html"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: correctness-report-pages
  cancel-in-progress: true

jobs:
  build-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Run deterministic correctness tests
        run: cargo test --workspace

      - name: Build correctness site
        env:
          SOURCE_REVISION: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: make correctness-site CORRECTNESS_REPORT=target/correctness-report.html

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: trellara-correctness-report
          path: target/correctness-site
          if-no-files-found: error

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/correctness-site

  deploy-report:
    needs: build-report
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
