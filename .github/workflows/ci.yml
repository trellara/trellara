name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libcurl4-openssl-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all --check

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build release CLI binaries
        run: |
          cargo build --release -p trellara-check
          cargo build --release -p trellara-cli --no-default-features --features local-stream
          cargo build --release -p trellara-cli --features full

      - name: Validate example config
        run: cargo run -p trellara-cli -- validate --config examples/retail-fleet/strict.yml

      - name: Verify no-broker quickstart config
        run: make quickstart-check

      - name: Verify quickstart proof artifacts
        run: make quickstart-proof-check

      - name: Verify compose config
        run: docker compose config --quiet

      - name: Verify correctness report is fresh
        run: make verify-correctness-report

      - name: Verify correctness site packaging
        run: make verify-correctness-site
