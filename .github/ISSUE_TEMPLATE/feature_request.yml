name: Feature request
description: Propose an operator capability or correctness improvement
title: "[feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Start with the operator problem and the evidence that would prove the outcome safe. Large protocol or compatibility changes should be discussed before implementation.
  - type: textarea
    id: problem
    attributes:
      label: Operator problem
      description: Who encounters this, under what conditions, and what do they have to do today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the observable result without prescribing an implementation.
    validations:
      required: true
  - type: dropdown
    id: boundary
    attributes:
      label: Likely boundary
      options:
        - Source safety or discovery
        - Capture or transaction protocol
        - Stream or source acknowledgement
        - PostgreSQL apply or checkpointing
        - Verification or recovery
        - Lakehouse or Iceberg
        - CLI or configuration
        - Native extension or packaging
        - Documentation or contributor experience
        - Unsure
    validations:
      required: true
  - type: textarea
    id: proof
    attributes:
      label: Acceptance evidence
      description: What test, report, invariant, or operator-visible proof would demonstrate that this is complete and safe?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing commands, workarounds, or designs you tried.
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and operational constraints
      description: Note versioning, migration, performance, managed-PostgreSQL, or deployment constraints.
