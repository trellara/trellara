config_version: 2
environment: development

source:
  id: local-source
  database_url: postgresql://trellara:trellara@source-postgres:5432/trellara_source
  publication: trellara_retail
  slot: trellara_retail_slot

dataset:
  id: retail-sales
  mode: partitioned_scale_mode
  partition:
    partition_count: 16
    key_column: store_id
    null_key_policy: quarantine
    key_change_policy: quarantine
  tables:
    - schema: public
      name: sales
      verify:
        primary_key: id
        excluded_columns: [updated_at]
    - schema: public
      name: sale_items
      verify:
        primary_key: id
        excluded_columns: [updated_at]
    - schema: public
      name: payments
      verify:
        primary_key: id
        excluded_columns: [updated_at]

stream:
  kind: kafka
  profile:
    kind: development
  bootstrap_servers: redpanda:9092
  topic: trellara.local-source.retail-sales.strict
  consumer_group: trellara-applier-local-source-retail-sales

target:
  database_url: postgresql://trellara:trellara@target-postgres:5432/trellara_target
